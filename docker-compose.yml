version: "3.8"

x-common-env: &common-env
  TZ: "Asia/Colombo"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      <<: *common-env
    networks:
      - traffic-net

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      <<: *common-env
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:29092",
          "--list",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traffic-net

  kafka-init:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Creating Kafka topics...' &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 4 --replication-factor 1 --topic traffic-raw &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic traffic-critical &&
        echo 'Topics created successfully.'
      "
    environment:
      <<: *common-env
    networks:
      - traffic-net

  postgres:
    image: postgres:16.2
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: traffic_user
      POSTGRES_PASSWORD: traffic_password
      POSTGRES_DB: traffic_db
      <<: *common-env
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic_user -d traffic_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traffic-net

  spark-master:
    image: bde2020/spark-master:3.2.1-hadoop3.2
    container_name: spark-master
    environment:
      - INIT_DAEMON_STEP=setup_spark
      - TZ=Asia/Colombo
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - spark-checkpoints:/tmp/spark-checkpoints
    networks:
      - traffic-net

  spark-worker:
    image: bde2020/spark-worker:3.2.1-hadoop3.2
    container_name: spark-worker
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - TZ=Asia/Colombo
    depends_on:
      - spark-master
    volumes:
      - spark-checkpoints:/tmp/spark-checkpoints
    networks:
      - traffic-net

  spark-submit:
    image: bde2020/spark-master:3.2.1-hadoop3.2
    container_name: spark-submit
    depends_on:
      - spark-master
      - kafka-init
      - postgres
    volumes:
      - ./spark_jobs:/spark_jobs
      - spark-checkpoints:/tmp/spark-checkpoints
    command: bash -c "sleep 15 && /spark/bin/spark-submit --master spark://spark-master:7077 --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.2.1,org.postgresql:postgresql:42.5.4 --conf spark.sql.streaming.forceDeleteTempCheckpointLocation=true /spark_jobs/stream_processor.py"
    networks:
      - traffic-net

  airflow-webserver:
    image: apache/airflow:2.9.2
    container_name: airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://traffic_user:traffic_password@postgres:5432/traffic_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - TZ=Asia/Colombo
    ports:
      - "8081:8080" # Mapping to 8081 since Spark Master uses 8080
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./reports:/opt/airflow/reports
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "[ -f /opt/airflow/airflow-webserver.pid ]"]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - traffic-net

  airflow-scheduler:
    image: apache/airflow:2.9.2
    container_name: airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://traffic_user:traffic_password@postgres:5432/traffic_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - TZ=Asia/Colombo
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./reports:/opt/airflow/reports
    command: scheduler
    networks:
      - traffic-net

  airflow-init:
    image: apache/airflow:2.9.2
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://traffic_user:traffic_password@postgres:5432/traffic_db
      - TZ=Asia/Colombo
    command: version
    entrypoint: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
      "
    networks:
      - traffic-net

  dashboard:
    image: python:3.10-slim
    container_name: traffic-dashboard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app
    working_dir: /app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: traffic_db
      POSTGRES_USER: traffic_user
      POSTGRES_PASSWORD: traffic_password
      <<: *common-env
    command: >
      bash -c "
        pip install --no-cache-dir -r requirements.txt &&
        python server.py
      "
    networks:
      - traffic-net

volumes:
  pg-data:
  spark-checkpoints:

networks:
  traffic-net:
    driver: bridge
